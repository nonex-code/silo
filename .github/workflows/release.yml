name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X github.com/nonex-code/silo/internal/shell.Version=$version" \
            -o "dist/silo${ext}" .
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -q "silo_windows_${{ matrix.goarch }}.zip" silo.exe
          else
            tar -czf "silo_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" silo
          fi
          rm -f silo silo.exe
      - uses: actions/upload-artifact@v4
        with:
          name: silo_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > checksums.txt
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true